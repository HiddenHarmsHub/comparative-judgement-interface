name: linting

on:
  workflow_call:
    inputs:
      run_ruff:
        description: Run Ruff checks
        required: false
        type: boolean
        default: false
      run_curlylint:
        description: Run Curlylint checks
        required: false
        type: boolean
        default: false
      run_eslint:
        description: Run ESLint checks
        required: false
        type: boolean
        default: false
      run_stylelint:
        description: Run Stylelint checks
        required: false
        type: boolean
        default: false

jobs:
    ruff:
        if: ${{ inputs.run_ruff }}
        permissions:
          contents: read
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Install Python 3.12
          uses: actions/setup-python@v5
          with: 
            python-version: "3.12"
        - name: Install dependencies
          run: |
            python -m venv venv
            source venv/bin/activate
            pip install ".[lint]"
        - name: Run Ruff
          run: |
            source venv/bin/activate
            ruff check .
            ruff format --check --diff .

    curlylint:
      if: ${{ inputs.run_curlylint }}
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install ".[lint]"
      - name: Run curlylint
        run: |
          source venv/bin/activate
          curlylint --verbose .

    eslint:
      if: ${{ inputs.run_eslint }}
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install dependencies
        run: |
          npm i eslint
          npm i @eslint/js
          npm i globals
          npm i @stylistic/eslint-plugin
          node_modules/eslint/bin/eslint.js comparison_interface/static/js/src/*.js tests/tests_javascript/*.js tests/tests_accessibility/*.js

    stylelint:
      if: ${{ inputs.run_stylelint }}
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install dependencies
        run: |
          npm i stylelint-config-standard
          npm i @stylistic/stylelint-plugin
          node_modules/stylelint/bin/stylelint.mjs ./comparison_interface/static/css
