name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ruff: ${{ steps.filter.outputs.ruff }}
      curlylint: ${{ steps.filter.outputs.curlylint }}
      eslint: ${{ steps.filter.outputs.eslint }}
      stylelint: ${{ steps.filter.outputs.stylelint }}
      pytest: ${{ steps.filter.outputs.pytest }}
      javascript_tests: ${{ steps.filter.outputs.javascript_tests }}
      accessibility: ${{ steps.filter.outputs.accessibility }}
      any_lint: ${{ steps.filter.outputs.ruff == 'true' || steps.filter.outputs.curlylint == 'true' || steps.filter.outputs.eslint == 'true' || steps.filter.outputs.stylelint == 'true' }}
      any_test: ${{ steps.filter.outputs.pytest == 'true' || steps.filter.outputs.javascript_tests == 'true' }}
    steps:
      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ruff:
              - '**/*.py'
            curlylint:
              - '**/*.html'
            eslint:
              - '**/*.js'
            stylelint:
              - '**/*.css'
            pytest:
              - '**/*.py'
              - 'tests/test_configurations/**'
              - 'tests/tests_python/**'
              - 'tests/tests_admin/**'
            javascript_tests:
              - '**/*.js'
              - 'tests/tests_javascript/**'
            accessibility:
              - 'comparison_interface/**/*.py'
              - 'comparison_interface/**/*.html'
              - 'comparison_interface/static/js/**/*.js'
              - 'comparison_interface/static/css/**/*.css'
              - 'tests/tests_accessibility/**'

  python_lint:
    needs: changes
    uses: ./.github/workflows/linting.yml
    with:
      run_ruff: true
      run_curlylint: false
      run_eslint: false
      run_stylelint: false

  html_lint:
    needs: changes
    uses: ./.github/workflows/linting.yml
    with:
      run_ruff: false
      run_curlylint: true
      run_eslint: false
      run_stylelint: false

  js_lint:
    needs: changes
    uses: ./.github/workflows/linting.yml
    with:
      run_ruff: false
      run_curlylint: false
      run_eslint: true
      run_stylelint: false

  css_lint:
    needs: changes
    uses: ./.github/workflows/linting.yml
    with:
      run_ruff: false
      run_curlylint: false
      run_eslint: false
      run_stylelint: true

  python_tests:
    needs: [changes, python_lint]
    if: >-
      always() &&
      needs.changes.outputs.pytest == 'true' &&
      needs.python_lint.result != 'failure' &&
      needs.python_lint.result != 'cancelled'
    uses: ./.github/workflows/testing.yml
    with:
      run_pytest: true
      run_javascript_tests: false

  javascript_tests:
    needs: [changes, js_lint]
    if: >-
      always() &&
      needs.changes.outputs.javascript_tests == 'true' &&
      needs.javascript_lint.result != 'failure' &&
      needs.javascript_lint.result != 'cancelled'
    uses: ./.github/workflows/testing.yml
    with:
      run_pytest: false
      run_javascript_tests: true

  accessibility:
    needs: [changes, python_lint, html_lint, css_lint, js_lint, python_tests, javascript_tests]
    if: >-
      always() &&
      needs.changes.outputs.accessibility == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/accessibility.yml
    with:
      run_accessibility: true
